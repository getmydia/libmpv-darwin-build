name: ci

on:
  push:
    branches:
      - main
      - "mydia/**"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# This fork (getmydia/libmpv-darwin-build) builds and releases only the
# `video-hdr` variant for macOS. The upstream variants are still built by a
# plain `make` without TARGET.
env:
  TARGET: mk-out-archive-xcframeworks-macos-universal-video-hdr

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c make XCODE_PATH=${XCODE_PATH} VERSION=${VERSION} TARGET=${TARGET}

      # MoltenVK must be linked directly (no Vulkan loader), and every
      # framework may only depend on the system or on its sibling frameworks.
      - name: Verify video-hdr frameworks
        run: |
          # no pipefail: `grep -q` closing the pipe early must not fail a check
          set -eu
          DIR=$(mktemp -d)
          tar -xzf result/libmpv-xcframeworks_*_macos-universal-video-hdr.tar.gz -C "${DIR}"
          cd "${DIR}"/*/

          for NAME in Mpv Placebo MoltenVK Avcodec; do
            test -d "${NAME}.xcframework" || { echo "missing ${NAME}.xcframework"; exit 1; }
          done

          for BIN in */macos-*/*.framework/Versions/A/*; do
            [ -f "${BIN}" ] || continue
            echo "== ${BIN}"
            lipo -archs "${BIN}"
            otool -L "${BIN}"
            # dependency lines are indented, per-arch headers are not
            if otool -L "${BIN}" | grep -E '^[[:space:]]' | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/|@rpath/[A-Za-z0-9_]+\.framework/)'; then
              echo "unexpected dependency in ${BIN}"
              exit 1
            fi
          done

          MPV=$(echo Mpv.xcframework/macos-*/Mpv.framework/Versions/A/Mpv)
          # positive control: the dependency filter above really sees Mpv's
          # dependency lines, so it cannot pass vacuously
          DEPS=$(otool -L "${MPV}" | grep -c -E '^[[:space:]]+@rpath/(Placebo|MoltenVK|Avcodec)\.framework/' || true)
          if [ "${DEPS}" -lt 3 ]; then
            echo "dependency lines of Mpv not matched (${DEPS})"
            exit 1
          fi

          # VP9 must not use VideoToolbox (FFmpeg ticket #9599), as in
          # video-default, and the other VideoToolbox hwaccels must be on
          AVCODEC=$(echo Avcodec.xcframework/macos-*/Avcodec.framework/Versions/A/Avcodec)
          strings "${AVCODEC}" | grep -o -- '--enable-hwaccel=[a-z0-9_]*' | sort -u
          strings "${AVCODEC}" | grep -q -- '--enable-hwaccel=hevc_videotoolbox'
          if strings "${AVCODEC}" | grep 'vp9_videotoolbox'; then
            echo "Avcodec enables the vp9_videotoolbox hwaccel"
            exit 1
          fi
          if otool -L "${MPV}" | grep -i vulkan; then
            echo "Mpv links a Vulkan loader"
            exit 1
          fi
          nm -m "${MPV}" | grep '_vkCreateMetalSurfaceEXT'
          nm -m "${MPV}" | grep -q '(undefined) external _vkCreateMetalSurfaceEXT (from MoltenVK)'
          nm -gU MoltenVK.xcframework/macos-*/MoltenVK.framework/Versions/A/MoltenVK | grep -q '_vkCreateMetalSurfaceEXT$'
          nm -m Placebo.xcframework/macos-*/Placebo.framework/Versions/A/Placebo | grep -q '(from MoltenVK)'
          strings "${MPV}" | grep -E '^mpv ' | sort -u

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-universal-video-hdr
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
